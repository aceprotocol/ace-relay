# Host nginx in front of one relay environment: ${RELAY_HOST} → 127.0.0.1:${APP_PORT}.
# Render one file per environment (only these two variables are substituted, so nginx's own $host etc. survive):
#   RELAY_HOST=relay.example.org APP_PORT=3000 envsubst '${RELAY_HOST} ${APP_PORT}' < nginx.conf > /etc/nginx/conf.d/relay.conf
server {
    listen 80;
    server_name ${RELAY_HOST};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${RELAY_HOST};

    ssl_certificate /etc/letsencrypt/live/${RELAY_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${RELAY_HOST}/privkey.pem;
    # Post-quantum hybrid key exchange; nginx must be linked against OpenSSL 3.5+.
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768:X25519;

    # SSE: disable buffering, long timeout
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:${APP_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }
}
